name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate project
        run: |
          python3 tests/smoke.py
          node --check app.js
          node --check projects.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest > /dev/null
